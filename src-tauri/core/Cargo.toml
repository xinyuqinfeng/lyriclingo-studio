[package]
name = "lyriclingo-core"
version = "0.1.0"
edition = "2021"
description = "Pure domain logic for LyricLingo Studio (no Tauri dependency)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
